name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  style:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck
      - name: Show tool versions
        run: |
          clang-format --version
          cppcheck --version
      - name: Check formatting
        run: make format-check
      - name: Static analysis
        run: make lint

  test:
    name: Tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind libclang-rt-18-dev
      - name: Show compiler version
        run: ${{ matrix.cc }} --version
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test
      - name: AddressSanitizer and UBSan
        run: |
          # ASan can crash on kernels with high mmap randomisation; 28 bits is the safe value
          sudo sysctl -w vm.mmap_rnd_bits=28
          make CC=${{ matrix.cc }} asan
      - name: Valgrind
        run: make CC=${{ matrix.cc }} valgrind
      - name: Example program
        run: make CC=${{ matrix.cc }} examples
